<svg xmlns="http://www.w3.org/2000/svg" width="420" height="92" viewBox="0 0 420 92" role="img" aria-labelledby="title desc">
  <title id="title">Sesh Tracker logo</title>
  <desc id="desc">Leaf checkmark icon with Sesh Tracker wordmark</desc>
  <defs>
    <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5AD8A7"/>
      <stop offset="52%" stop-color="#20A77A"/>
      <stop offset="100%" stop-color="#157A5C"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E6F6EE"/>
      <stop offset="100%" stop-color="#D9F1E5"/>
    </linearGradient>
  </defs>

  <g transform="translate(6 6)">
    <rect x="0" y="0" width="78" height="78" rx="22" fill="url(#ringGrad)" stroke="#C7E7D8"/>
    <path d="M39 16c12 0 24 9 24 24 0 14-10 27-24 31C25 67 15 54 15 40c0-15 12-24 24-24Z" fill="url(#leafGrad)"/>
    <path d="M28 43.5 36.6 52 53 34.8" fill="none" stroke="#ffffff" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M39 26v37" stroke="rgba(255,255,255,0.25)" stroke-width="2" stroke-linecap="round"/>
  </g>

  <g font-family="Plus Jakarta Sans, Inter, system-ui, sans-serif" fill="#184B3B">
    <text x="98" y="44" font-size="31" font-weight="700" letter-spacing="-0.02em">Sesh</text>
    <text x="98" y="72" font-size="31" font-weight="700" letter-spacing="-0.02em">Tracker</text>
  </g>
</svg>
